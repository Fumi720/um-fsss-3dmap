<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UM FSSS 3D Smart Campus Map & Voice Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #fff; }

    .top-bar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96); padding: 8px 18px; border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 100;
      display: flex; align-items: center; gap: 12px; white-space: nowrap;
      color: #1e3a8a; font-weight: 700; font-size: 13px;
    }
    .mappedin-btn {
      background: #10b981; color: #fff; text-decoration: none;
      padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: 700;
    }

    .map-viewport {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      padding-bottom: 190px;
    }
    svg#campus-3d {
      width: 96%; max-width: 820px; height: auto; max-height: 62vh;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
    }
    .bldg { cursor: pointer; transition: opacity 0.2s; }
    .bldg:hover { opacity: 0.85; }
    .bldg-label { font-size: 11px; font-weight: 700; fill: #ffffff; pointer-events: none; text-anchor: middle; }
    .bldg-sub { font-size: 8.5px; fill: #cbd5e1; pointer-events: none; text-anchor: middle; }
    .route-line {
      fill: none; stroke: #38bdf8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 10 8; animation: dashMove 1s linear infinite;
    }
    @keyframes dashMove { to { stroke-dashoffset: -18; } }

    .voice-assistant {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 580px; background: rgba(255, 255, 255, 0.98);
      border-radius: 20px; padding: 14px 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.4);
      z-index: 100; border: 1px solid #cbd5e1; color: #1e293b;
    }
    .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
    .chip-btn {
      background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
      border-radius: 16px; padding: 5px 11px; font-size: 12px; font-weight: 600;
      white-space: nowrap; cursor: pointer;
    }
    .chip-btn:hover { background: #2563eb; color: #fff; }
    .chat-display { font-size: 13px; color: #1e293b; margin-bottom: 10px; min-height: 48px; max-height: 125px; overflow-y: auto; line-height: 1.45; }
    .user-msg { color: #2563eb; font-weight: 600; margin-bottom: 3px; font-size: 12px; }
    .bot-msg { background: #f8fafc; border-left: 3.5px solid #1e3a8a; padding: 7px 10px; border-radius: 0 8px 8px 0; }
    .step-list { margin-top: 4px; padding-left: 18px; }
    .audio-controls { display: flex; gap: 8px; margin-top: 6px; }
    .mini-btn { background: #e2e8f0; border: none; border-radius: 6px; padding: 4px 9px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .controls { display: flex; gap: 8px; }
    #text-input { flex: 1; padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; outline: none; }
    .action-btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: #fff; }
    #send-btn { background: #1e3a8a; }
    #mic-btn { background: #dc2626; }
    #mic-btn.listening { background: #16a34a; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>🏛️ UM FSSS 3D Campus Map</span>
    <a class="mappedin-btn" href="https://mappedin.com" target="_blank" rel="noopener">↗ Open Mappedin 3D</a>
  </div>

        <text x="687" y="210" class="bldg-label">I 07</text>

      <path id="nav-path" class="route-line" d="M 452,355 L 452,230 L 178,230" />
      <circle cx="452" cy="355" r="7" fill="#22c55e" stroke="#fff" stroke-width="2" />
      <circle id="dest-pin" cx="178" cy="230" r="8" fill="#f43f5e" stroke="#fff" stroke-width="2" />
    </svg>
  </div>

  <div class="voice-assistant">
    <div class="quick-chips">
      <button type="button" class="chip-btn" onclick="askBot('Dean Office')">🏛️ Dean's Office</button>
      <button type="button" class="chip-btn" onclick="askBot('Chinese Studies')">🇨🇳 Chinese Studies</button>
      <button type="button" class="chip-btn" onclick="askBot('Makmal Komputer')">💻 Computer Lab</button>

      <button type="button" class="chip-btn" onclick="askBot('DKA')">🎓 DKA / DKB / DKC</button>
      <button type="button" class="chip-btn" onclick="askBot('Bilik Cube')">🧊 Bilik Cube</button>
    </div>

    <div class="chat-display" id="chat-display">
      <div class="bot-msg">👋 <b>Tap any 3D building above</b> or ask below! The blue route line and voice guide will lead you there.</div>
    </div>

    <div class="controls">
      <input type="text" id="text-input" placeholder="Ask e.g. 'Bilik Cube' or 'DKA'..." onkeydown="if(event.key==='Enter') sendInput()" />
      <button type="button" class="action-btn" id="send-btn" onclick="sendInput()">Ask</button>
      <button type="button" class="action-btn" id="mic-btn" onclick="startVoice()">🎤 Speak</button>
    </div>
  </div>

  <script>
    var lastSpoken = "";

    function speakText(t) {
      lastSpoken = t;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        var m = new SpeechSynthesisUtterance(t);
        m.lang = "en-US";
        m.rate = 0.98;
        window.speechSynthesis.speak(m);
      }
    }
    function stopText() { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); }
    function replayText() { if (lastSpoken) speakText(lastSpoken); }

    function updateMapRoute(pathD, destX, destY) {
      var p = document.getElementById("nav-path");
      var d = document.getElementById("dest-pin");
      if (p) p.setAttribute("d", pathD);
      if (d) { d.setAttribute("cx", destX); d.setAttribute("cy", destY); }
    }
