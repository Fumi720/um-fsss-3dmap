      font-size: 12px;
      font-weight: 600;

      line-height: 1.55;

    .bot-msg {
      background: #f8fafc;
      border-left: 3.5px solid #1e3a8a;
      padding: 8px 12px;
      border-radius: 0 10px 10px 0;
    }

    .step-list { margin-top: 6px; padding-left: 18px; color: #334155; }

    .audio-controls { display: flex; gap: 8px; margin-top: 8px; }
    .mini-btn {
      background: #e2e8f0;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mini-btn:hover { background: #cbd5e1; }

    .controls { display: flex; gap: 8px; align-items: center; }

    #text-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #mic-btn {
      background: #dc2626;
      color: white;
      display: flex;
      align-items: center;
      gap: 5px;
